<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ABC早押しクイズ 自動読み上げアプリ</title>
  <!-- Google Fonts: Noto Sans JP, Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Header (サイト名 | 問題取得 | 設定) -->
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">⚡</span>
        <h1 class="app-title">早押しクイズ</h1>
      </div>
      <div class="header-actions">
        <button id="btn-refresh-gacha" class="btn btn-gacha" title="100問を取得">
          問題取得
        </button>
        <button id="btn-toggle-settings" class="btn btn-circle-settings" title="設定を開く">
          設定
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <div class="quiz-container">

        <!-- 1. 【問題表示】 Card (Top Rounded Blue Card) -->
        <div class="question-card">
          <!-- Info Bar -->
          <div class="info-bar">
            <div class="q-progress">
              <span class="q-label">問題</span>
              <span id="current-q-num" class="q-num">1</span>
              <span class="q-total">/ <span id="max-q-num">100</span></span>
            </div>
            <div id="q-genre-tag" class="genre-badge">ABC過去問</div>
            <div class="nav-controls">
              <button id="btn-prev-q" class="btn btn-sm">⏮ 前へ</button>
              <select id="q-select-dropdown" class="select-sm"></select>
              <button id="btn-next-q" class="btn btn-sm">次へ ⏭</button>
            </div>
          </div>

          <div class="card-header">
            <span class="card-title">【問題表示】</span>
            <span id="speech-status" class="status-indicator ready">待機中</span>
          </div>
          
          <div id="question-text-box" class="question-text-box">
            <span class="placeholder-text">「読み上げ開始」を押すか、Spaceキーでスタート</span>
          </div>

          <!-- Buzz Marker -->
          <div id="buzz-marker-info" class="buzz-marker-info hidden">
            <span class="buzz-badge">⚡ 早押し発生</span>
            <span id="buzz-position-text"></span>
          </div>
        </div>

        <!-- 2. 【回答】 Card (Middle Card in Answer Shown Wireframe Image) -->
        <div id="answer-box" class="answer-card hidden">
          <span class="answer-label">【回答】</span>
          <span id="answer-text" class="answer-text">----</span>
        </div>

        <!-- 3. Action Area (State 1: Circle Button, State 2: Split Pills, State 3: Next Button) -->
        <div class="action-stage">
          <div id="step-guide" class="step-guide">
            <span id="step-badge" class="step-badge">STEP 1</span>
            <span id="step-text">「読み上げ開始」を押して音声を再生してください</span>
          </div>

          <!-- State 1: Red Circle Button (ボタン) -->
          <div id="circle-button-container" class="circle-button-container">
            <button id="btn-play" class="btn-circle btn-circle-play">
              <div class="circle-inner">
                <span class="circle-icon">▶️</span>
                <span class="circle-text">読み上げ開始</span>
                <span class="circle-sub">[ SPACE ]</span>
              </div>
            </button>

            <button id="btn-buzz" class="btn-circle btn-circle-buzz hidden">
              <div class="circle-inner">
                <span class="circle-icon">🔴</span>
                <span class="circle-text">ボタン</span>
                <span class="circle-sub">[ SPACE / タップ ]</span>
              </div>
            </button>
          </div>

          <!-- State 2: Split Semicircle Choice Grid (読み直し | 回答表示 Wireframe Image) -->
          <div id="choice-container" class="split-pill-grid hidden">
            <button id="btn-pass" class="btn btn-split btn-split-left">
              <span class="split-icon">↩️</span>
              <span class="split-text">読み直し</span>
            </button>
            <button id="btn-show-answer" class="btn btn-split btn-split-right">
              <span class="split-icon">👁️</span>
              <span class="split-text">回答表示</span>
            </button>
          </div>

          <!-- State 3: Next Question Button (次の問題 Wireframe Image) -->
          <div id="next-container" class="next-grid hidden">
            <button id="btn-next-solo" class="btn btn-main btn-next">
              ⏭️ 次の問題 (Space / Enter)
            </button>
            <button id="btn-reread" class="btn btn-ctrl">
              🔄 最初から読み直す
            </button>
          </div>
        </div>

      </div>
    </main>

    <!-- Voice Settings Drawer / Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>⚙️ 音声・読み上げ設定</h3>
          <button id="btn-close-settings" class="btn-close">✕</button>
        </div>
        <div class="settings-body">
          <div class="form-group">
            <label>👁️ 問題文の表示モード:</label>
            <select id="select-text-mode" class="select-full">
              <option value="realtime" selected>✨ リアルタイム表示（読み上げと同時に文字表示）</option>
              <option value="hidden">🙈 事前非表示（早押し後/解答表示まで伏せる）</option>
              <option value="visible">👁️ 常に全表示（最初からすべて表示）</option>
            </select>
          </div>

          <div class="form-group">
            <label>🎙️ 読み上げボイス (おすすめ高音質ボイス優先):</label>
            <select id="select-voice" class="select-full"></select>
          </div>

          <div class="form-group">
            <label>⚡ 読み上げ速度: <span id="rate-value" class="val-badge">1.0x</span></label>
            <input type="range" id="range-rate" min="0.8" max="2.5" step="0.1" value="1.0">
            <div class="range-labels">
              <span>0.8x (ゆっくり)</span>
              <span>1.0x (標準速度)</span>
              <span>2.5x (超高速)</span>
            </div>
          </div>

          <div class="form-group">
            <label>🎵 ピッチ (声の高さ): <span id="pitch-value" class="val-badge">1.0</span></label>
            <input type="range" id="range-pitch" min="0.6" max="1.4" step="0.1" value="1.0">
          </div>

          <button id="btn-test-speech" class="btn btn-secondary btn-full">
            🔊 声のテスト再生
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/abc_dataset.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
